//--------------------数据管理服务--------------------
syntax = "proto3";
option go_package = "/dm";//必须为服务名
import "google/protobuf/wrappers.proto";
import "dmShare.proto";
package dm;//必须为服务名

message DataEmpty{
}
message DataWithID{
  int64 id = 1; //ID值
}

service DataManage {
  rpc dataProjectCreate (DataProjectSaveReq) returns(DataEmpty);   //创建单个用户项目数据权限
  rpc dataProjectUpdate (DataProjectUpdateReq) returns(DataEmpty);   //更新用户项目数据权限
  rpc dataProjectBatchCreate (DataProjectBatchSaveReq) returns(DataEmpty);   //批量创建用户项目数据权限
  rpc dataProjectDelete (DataProjectDeleteReq) returns(DataEmpty);   //删除单个用户项目数据权限
  rpc dataProjectBatchDelete(DataProjectBatchDeleteReq)returns(DataEmpty); //批量删除用户项目数据权限
  rpc dataProjectGetList (DataProjectGetListReq) returns (DataProjectGetListResp); //获取用户项目数据权限列表

  rpc dataAreaBatchUpdate (DataAreaBatchUpdateReq) returns(DataEmpty);   //批量更新用户区域数据权限
  rpc dataAreaGetList (DataAreaGetListReq) returns (DataAreaGetListResp); //获取用户区域数据权限列表
  rpc dataAreaBatchDelete (DataAreaBatchDeleteReq) returns(DataEmpty); //批量删除用户区域数据权限

  rpc userAreaApplyGetList(UserAreaApplyGetListReq)returns(UserAreaApplyGetListResp); //获取用户区域权限申请列表
  rpc userAreaApplyDeal(UserAreaApplyDealReq)returns(DataEmpty);//处理用户区域权限申请
  rpc userAreaApplyCreate(UserAreaApplyCreateReq)returns(DataEmpty);//用户申请区域权限
}

message DataProjectSaveReq{
  int64 targetID = 1; //用户ID（必填，雪花ID）
  string targetType = 2;
  int64 projectID = 3; //权限数据ID
  int64 authType =4; // 1:读权限,只能读,不能写 4:管理权限,可以修改别人的权限
  string memberRemark = 5; //家庭创建者为成员设置的称呼
}
message DataProjectUpdateReq{
  int64 targetID = 1; //用户ID（必填，雪花ID）
  string targetType = 2;
  int64 projectID = 3; //权限数据ID
  google.protobuf.StringValue memberRemark = 4; //成员称呼；传空字符串表示清空，不传表示不修改
}
message DataProjectBatchSaveReq{
  repeated int64 targetIDs = 1; //用户ID（必填，雪花ID）
  string targetType = 2;
  int64 projectID = 3; //权限数据ID
  int64 authType =4; // 1:读权限,只能读,不能写 4:管理权限,可以修改别人的权限
}
message DataProjectDeleteReq{
  int64 targetID = 1; //用户ID（必填，雪花ID）
  string targetType = 2;
  int64 projectID = 3; //权限数据ID
}
message DataProjectBatchDeleteReq{
  repeated int64 targetIDs = 1; //用户ID（必填，雪花ID）
  string targetType = 2;
  int64 projectID = 3; //权限数据ID
}
message DataProjectGetListReq {
    PageInfo page = 1 ; //进行数据分页（不传默认2000相当于全部）
    int64 projectID =2; //获取该项目实际获得的权限
    int64 targetID = 3;
    string targetType =4; //user:用户 role:角色
    int64 authType =5; // 1:读权限,只能读,不能写 4:管理权限,可以修改别人的权限
}
message DataProjectGetListResp {
    int64 total = 1; //总数
    repeated DataProject list = 2; //用户数据权限列表
}
message DataAreaBatchUpdateReq {
  int64 targetID = 1; //用户ID（必填，雪花ID）
  string targetType = 2;
  int64 projectID = 3; //项目id
  repeated DataArea areas = 4; //权限数据IDs
}
message DataAreaGetListReq {
  PageInfo page = 1 ; //进行数据分页（不传默认2000相当于全部）
  int64 projectID = 3; //项目id 必选
  int64 targetID = 4;
  string targetType =5;
  repeated int64 areaIDs = 6; //区域ID列表,用于查询指定区域的授权用户
}
message DataAreaGetListResp {
  int64 total = 1; //总数
  repeated DataArea list = 2; //用户数据权限列表
}
message DataAreaBatchDeleteReq{
  int64 projectID = 1; //项目id 必选
  int64 targetID = 2;
  string targetType =3;
  repeated int64 areaIDs = 4;
}
message UserAreaApplyGetListReq{
  PageInfo page = 1 ; //进行数据分页（不传默认2000相当于全部）
  int64 areaID = 2; //项目id
  repeated int64 authTypes =3; // 1:读权限,只能读,不能写 4:管理权限,可以修改别人的权限
}
message UserAreaApplyGetListResp{
  int64 total = 1; //总数
  repeated UserAreaApplyInfo list = 2; //用户数据权限列表
}
message UserAreaApplyDealReq{
  bool isApprove = 1; //是否同意
  repeated int64 ids = 2; //授权申请的id列表
}

message UserAreaApplyCreateReq{
  int64 areaID   = 1; // 区域ID
  int64 authType = 2; // 授权类型 1:读权限,只能读,不能写 4:管理权限,可以修改别人的权限
}

message DataProject {
    int64 projectID = 1; //权限数据ID
    int64 authType =2; // 1:读权限,只能读,不能写 4:管理权限,可以修改别人的权限
    int64 targetID = 3; //用户ID（必填，雪花ID）
    int64 updatedTime=4; //更新时间
    string memberRemark = 5; //家庭创建者为成员设置的称呼
}
message DataArea {
  int64 areaID = 1; //项目id
  int64 authType =2; // 1:读权限,只能读,不能写 4:管理权限,可以修改别人的权限
  int64 isAuthChildren =3; //是否同时授权子节点（1:是，2:否），默认为2
  int64 areaIDPath = 4;
  int64 targetID = 5; //用户ID或Roleid（必填，雪花ID）
  string targetType = 6;
  int64 updatedTime=7; //更新时间
}

message UserAreaApplyInfo{
  int64 id = 1; //项目id
  int64 userID = 2;
  int64 areaID = 3; //项目id
  int64 authType =4; // 1:读权限,只能读,不能写 4:管理权限,可以修改别人的权限
  int64 createdTime = 5;
}
