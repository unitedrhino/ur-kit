//--------------------区域管理服务--------------------
syntax = "proto3";
option go_package = "/dm";//必须为服务名
import "google/protobuf/wrappers.proto";
import "dmShare.proto";
import "deviceManage.proto";
package dm;//必须为服务名

message AreaWithID {
  int64 areaID = 1; //项目区域id
}
message AreaEmpty{
}

service AreaManage {
  rpc areaInfoCreate (AreaInfo) returns (AreaWithID); //创建区域信息
  rpc areaInfoUpdate (AreaInfo) returns(AreaEmpty); //更新区域信息
  rpc areaInfoDelete (AreaWithID) returns(AreaEmpty); //删除区域
  rpc areaInfoGetOne (AreaInfoGetOneReq) returns (AreaInfo); //获取区域信息详情
  rpc areaInfoGetList (AreaInfoGetListReq) returns (AreaInfoGetListResp); //获取区域信息列表（支持分页和过滤）

  rpc areaProfileGetOne(AreaProfileGetOneReq)returns(AreaProfile); //获取区域配置文件详情
  rpc areaProfileUpdate(AreaProfile)returns(AreaEmpty); //更新区域配置文件
  rpc areaProfileGetList(AreaProfileGetListReq)returns(AreaProfileGetListResp); //获取区域配置文件列表（支持分页和过滤）
}

message AreaInfo {
  string tenantCode =20;//租户号
  int64 createdTime = 1; //创建时间（只读，毫秒时间戳）
  int64 areaID = 2; //项目区域id（只读）
  int64 parentAreaID = 3; //上级项目区域id（只读）
  int64 projectID = 4; //项目id（只读）
  string areaName = 5; //项目区域名称（读写）
  Point Position = 6; //项目区域定位，默认百度坐标系（读写）
  google.protobuf.StringValue desc = 7; //项目区域备注（读写）
  repeated AreaInfo children = 8; //下级项目区域列表（只读）
  string areaIDPath =9; //区域ID路径（如：1/2/3）
  string areaNamePath =10; //区域名称路径（如：区域1/区域2/区域3）
  int64 lowerLevelCount =11;//下级区域的数量
  repeated int64 childrenAreaIDs =12;//所属的子区域id列表
  int64 isLeaf =13;//是否是叶子节点（1:是，2:否）
  string useBy =14;//用途
  string areaImg =15;//区域图片

  google.protobuf.Int64Value deviceCount=17;//绑定该区域的设备统计
  google.protobuf.Int64Value groupCount=19; //绑定该区域的分组统计
  int64 isSysCreated =18; //是否是系统创建的（1:是，2:否），系统创建的只有管理员可以删除
  string configFile =21;//区域配置文件

  map<string, string> tags = 23; //标签信息
  int64 sort = 24; // 排序标记
  repeated Attachment attachments =25;//附件列表
  repeated DeviceInfo devices = 26; //区域下设备列表（按需返回）
}
message AreaInfoGetOneReq {
  int64 projectID = 1; //项目ID
  int64 areaID = 2; //项目区域id
  bool withChildren = 3;//是否返回子节点（true:是，false:否）
  string tenantCode =10;//指定租户,只有超级管理员可以操作
}
message AreaInfoGetListReq {
  PageInfo page = 1; //进行数据分页（不传默认2000相当于全部）
  int64 projectID = 3; //项目ID
  int64 parentAreaID = 4; //父区域ID
  repeated int64 areaIDs = 5; //区域ID列表
  bool  isRetTopLevel = 6;//如果该参数为true则返回除了root节点的有权限的最高层的区域列表
  int64 isLeaf =7;//是否是叶子节点（1:是，2:否）
  CompareInt64 deviceCount =8; //设备数量过滤条件
  CompareInt64 groupCount =9; //分组数量过滤条件
  string tenantCode =10;//指定租户,只有超级管理员可以操作
  bool withDevices = 11; //是否同时返回区域下设备列表
}
message AreaInfoGetListResp {
  int64 total = 1; //总数
  repeated AreaInfo list = 2; //项目区域列表
}
message AreaProfile{
  int64 areaID = 1; //项目区域id
  string code =2; //配置编码
  string params =3; //配置参数
}
message AreaProfileGetOneReq{
  int64 areaID = 2; //项目区域id
  string code =4; //配置编码
}
message AreaProfileGetListReq{
  int64 areaID = 1; //项目区域id
  repeated string codes = 2; //配置编码列表
}
message AreaProfileGetListResp{
  repeated AreaProfile profiles =1; //区域配置列表
}
