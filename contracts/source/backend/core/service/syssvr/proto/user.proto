//--------------------用户管理服务--------------------
syntax = "proto3";
option go_package = "/sys";//必须为服务名
import "google/protobuf/wrappers.proto";
import "share.proto";
import "role.proto";
import "department.proto";
import "tenant.proto";
import "notify.proto";
package sys;//必须为服务名

message UserWithCode{
  string code=1; //Code值
}
message UserEmpty{
}

service UserManage {
  rpc userInfoBatchCreate(UserInfoBatchCreateReq) returns(UserInfoBatchCreateResp);//批量创建用户并分配企业角色
  rpc userInfoCreate(UserInfoCreateReq) returns(UserCreateResp);//创建用户信息
  rpc userInfoGetList(UserInfoGetListReq) returns(UserInfoGetListResp);//获取用户列表（支持分页和过滤）
  rpc userInfoUpdate(userInfoUpdateReq) returns(UserEmpty);//更新用户基本数据
  rpc userInfoGetOne(UserInfoGetOneReq) returns(UserInfo);//获取用户详细信息
  rpc userInfoDelete(UserInfoDeleteReq) returns(UserEmpty);//删除用户
  rpc userLogin(UserLoginReq) returns(UserLoginResp);//用户登录
  rpc userThirdAuthStart(UserThirdAuthStartReq) returns(UserThirdAuthStartResp);//第三方登录授权起跳
  rpc userThirdLogin(UserThirdLoginReq) returns(UserThirdLoginResp);//第三方登录回调换平台登录态
  rpc userThirdRegister(UserThirdRegisterReq) returns(UserLoginResp);//第三方补全注册并登录
  rpc userLogout(UserLogoutReq) returns(UserEmpty);//用户登出

  rpc userForgetPwd(UserForgetPwdReq)returns(UserEmpty);//用户忘记密码处理
  rpc userCaptcha(UserCaptchaReq)returns(UserCaptchaResp);//获取验证码
  rpc userCheckToken(UserCheckTokenReq) returns(UserCheckTokenResp);//验证用户令牌有效性
  rpc userRegister(UserRegisterReq) returns(UserLoginResp);//用户注册
//  rpc userTaRegister(UserTaRegisterReq) returns(UserLoginResp);//Tenant Admin register 只有开启了租户管理员注册才可使用
  rpc userChangePwd(UserChangePwdReq) returns(UserEmpty);//用户修改密码
  rpc userBindAccount(UserBindAccountReq)returns(UserEmpty);//用户绑定账号
  rpc userInfoResetPwd(UserInfoResetPwdReq) returns(UserEmpty);//管理员重置用户密码(仅平台超管)

  rpc userRoleGetList(UserRoleGetListReq) returns (UserRoleGetListResp); //获取用户角色列表
  rpc userRoleBatchUpdate(UserRoleBatchUpdateReq) returns(UserEmpty); //更新用户角色
  rpc userRoleBatchCreate(UserRoleBatchUpdateReq) returns(UserEmpty); //为用户添加角色

  rpc userDeptGetList(UserDeptGetListReq) returns (UserDeptGetListResp); //获取用户部门列表
  rpc userDeptBatchDelete(UserDeptBatchSaveReq) returns(UserEmpty); //删除用户部门关联
  rpc userDeptBatchCreate(UserDeptBatchSaveReq) returns(UserEmpty); //为用户添加部门

  rpc userMessageBatchIsRead(IDList)returns(UserEmpty);//用户消息批量标记为已读
  rpc userMessageGetList(UserMessageGetListReq)returns(UserMessageGetListResp);//获取用户消息列表
  rpc userMessageStatistics(UserEmpty)returns(UserMessageStatisticsResp);//获取用户消息统计信息
  rpc userProfileGetOne(UserWithCode)returns(UserProfile);//获取用户配置信息
  rpc userProfileUpdate(UserProfile)returns(UserEmpty);//更新用户配置信息
  rpc userProfileDelete(UserWithCode)returns(UserEmpty);//删除用户配置信息
  rpc userProfileGetList(UserProfileGetListReq)returns(UserProfileGetListResp);//获取用户配置信息列表
  rpc userPushClientReport(UserPushClientReportReq)returns(UserEmpty);//上报或解绑推送客户端

  rpc userDataProjectGetList (UserDataProjectGetListReq) returns (UserDataProjectGetListResp); //获取用户项目数据权限列表
  rpc userDataAreaGetList (UserDataAreaGetListReq) returns (UserDataAreaGetListResp); //获取用户区域数据权限列表
  rpc userTenantGetList(UserTenantGetListReq) returns(UserTenantGetListResp); //获取用户所在租户列表

  // 用户访问令牌管理（参考GitHub PAT）
  rpc userAccessTokenCreate(UserAccessToken) returns(UserWithID);           // 创建访问令牌
  rpc userAccessTokenCreateInternal(UserAccessTokenCreateInternalReq) returns(UserAccessTokenCreateInternalResp); // 创建内部令牌（系统调用）
  rpc userAccessTokenUpdate(UserAccessToken) returns(UserEmpty);        // 更新访问令牌
  rpc userAccessTokenDelete(UserWithID) returns(UserEmpty);                 // 删除访问令牌
  rpc userAccessTokenGetOne(UserWithID) returns(UserAccessToken);           // 获取单个访问令牌
  rpc userAccessTokenGetList(UserAccessTokenGetListReq) returns(UserAccessTokenGetListResp); // 获取访问令牌列表
}

message  UserChangePwdReq{
  string  type = 1;//验证类型: email:邮箱 phone:手机号 pwd:原密码
  string oldPassword=2;//pwd方式需要填写 如果原来没有设置过密码可以不填 输入原密码修改密码(md5格式并需要输入图像验证码)
  string password =3;//新密码
  string code = 5;//验证码    微信登录填code
  string codeID = 6;//验证码编号 微信登录填state
}

// UserInfoResetPwdReq 管理员重置用户密码请求(仅平台超管可用)
message UserInfoResetPwdReq{
  int64 userID = 1;//目标用户ID
  string password = 2;//新密码(SHA-256 十六进制摘要,禁止明文,与登录 pwdType=1 凭证格式一致)
}

message UserInfo{
//  string tenantCode =22;
  int64  userID = 1;                // 用户ID
  string userName =2;               // 登录账号
  string password =3;               // 密码
  google.protobuf.StringValue email = 4; // 邮箱
  google.protobuf.StringValue phone =5; // 手机号
  string lastIP =7;                 // 上次登录IP
  string lastTokenID =27;           // 上次登录令牌ID
  int64 lastLoginTime =28;          // 最后登录时间(毫秒时间戳)
  string regIP =8;                  // 注册IP
  string nickName =9;               // 昵称
  string city =10;                  // 城市
  string country =11;               // 国家
  string province =12;              // 省份
  string language =13;              // 语言
  int64  createdTime =15;           // 创建时间（毫秒时间戳）
  int64  sex =17;                   // 性别（1:男，2:女，0:未知）
  string avatar =19;                // 头像,更新的时候传图片的filePath
  repeated UserTenant tenants=21;   // 租户列表
  repeated UserThird thirds =22;    // 绑定的第三方账号列表
}
message UserCreateResp{
  int64 userID = 1; // 用户ID
}
message UserInfoCreateReq{
  UserInfo info = 1;
  repeated int64 roleIDs =2;
  repeated UserCreateTenantBinding tenantBindings = 3; // 创建时加入的企业及其角色
}
message UserInfoGetListReq{
  PageInfo page       = 1;//分页信息 只获取一个则不填 搜索的字段: userID:用户id userName:登录用户名  email:邮箱  phone:手机号
  string userName = 2;
  string phone = 3;
  string email = 4;
  repeated int64 userIDs =5;
  string account =6;
  // repeated int64 hasAccessAreas =7;
  // string roleCode =8;
  // CompareInt64 updatedTime=9;
  // int64 deptID =10;
  string nickName =11;
  string openID =12;      // 按第三方 openID 精确过滤（对应 sys_user_third.open_id）
  string unionID =13;     // 按第三方 unionID 精确过滤
  bool withThirds =14;    // 返回绑定的第三方账号列表
}
message UserInfoGetListResp{
  repeated UserInfo list = 1;
  int64 total = 2;
}
message userInfoUpdateReq{
  UserInfo info =1;
  bool WithRoot =2;//root可以修改所有字段
  bool languageSet =3;//是否显式更新个人语言；true 且 info.language 为空表示清除
}
message UserInfoGetOneReq{
  int64 userID=1;
  string openID=2;   // 按第三方 openID 反查（如钉钉 UserID），userID=0 时生效
  string unionID=3;  // 按第三方 unionID 反查，userID=0 时生效
}
message UserInfoDeleteReq{
  int64 userID = 1;
}
message UserLoginReq{
    string account = 1; //登录账号(支持用户名,手机号登录) 账号密码登录时需要填写
    int32 pwdType = 2;//账号密码登录的凭据类型：0 无密码；1 SHA-256 摘要（当前标准）；2 MD5 摘要（仅历史兼容）
    string password =3;//账号密码登录凭据；pwdType=1 时传原始密码的 SHA-256 十六进制摘要，CLI 接收原始密码并负责生成该摘要
    string loginType =4;//验证类型 phone 手机号 wxOpen 微信开放平台 wxIn 微信内 wxMiniP 微信小程序 pwd 账号密码
    string code = 5;//验证码    微信登录填code
    string codeID = 6;//验证码编号 微信登录填state
    string ip = 7;//透传请求的 ip
    string deviceID =8;//设备ID 可选
    string tenantCode =9;//目标租户编码，显式透传，避免依赖上下文透传
}
message UserLoginResp{
  UserInfo info = 1;
  JwtToken token =2;
}
message UserThirdAuthStartReq{
  string provider = 1;
  string platform = 2;
}
message UserThirdAuthStartResp{
  string authUrl = 1;
  string state = 2;
}
message UserThirdLoginReq{
  string provider = 1;
  string code = 2;
  string state = 3;
  string platform = 4;
  string deviceID = 5;
  string tenantCode = 6;
}
message UserThirdLoginResp{
  string status = 1; // success need_register_completion
  UserLoginResp login = 2;
  string pendingToken = 3;
  string provider = 4;
  string message = 5;
}
message UserThirdRegisterReq{
  string pendingToken = 1;
  string regType = 2; // email phone
  string account = 3;
  string code = 4;
  string codeID = 5;
  string password = 6;
  string nickName = 7;
  string tenantCode = 8;
  string deviceID = 9;
}
message UserLogoutReq{
  string token = 1;
}
message UserForgetPwdReq{
  string account = 1; //登录账号(支持用户名,手机号登录) 账号密码登录时需要填写
  string  type = 2;//账号类型: email:邮箱 phone:手机号
  string password =3;//密码
  string code = 5;//验证码    微信登录填code
  string codeID = 6;//验证码编号 微信登录填state
}
message UserCaptchaReq{
  string account = 1;//短信验证时填写手机号,邮箱验证时填写邮箱
  string type = 2;//验证方式:短信验证,图片验证码,邮箱验证
  string use = 3;//用途
  string codeID = 4;//验证码编码
  string code = 5;//验证码
  string ip = 6;//透传请求的 ip
}
message UserCaptchaResp{
  string codeID = 1;//验证码编码
  string code = 2;//验证码--只有图片验证码由apisvr生成,其他方式返回空
  int64 expire = 3;//过期时间
}
message UserCheckTokenReq{
  string token = 1;       // 用户令牌
  string ip = 2;          // 请求IP地址
  int64  appID = 3;       // 应用ID
  string authType =4;     // 认证类型（user:普通用户, open:开放第三方认证）
  string deviceID =5;     // 设备ID（如果登录的时候传了设备ID,那么后面会话的时候都会检查设备ID是否一致）
  string tenantCode = 6;  // 当前访问的租户号
}
message UserCheckTokenResp{
  string token = 1;  // 如果时间不多会更新jwt，需要判断jwt是否为“” 如果不为空，则需要更新用户的token
  int64 userID = 2;  // 用户ID
  repeated int64 roleIDs = 3; // 角色ID列表
  repeated string roleCodes = 4; // 角色编码列表
  string tenantCode = 5; // 租户编码
  bool isAdmin = 6; // 是否是管理员
  bool isOwner = 7; // 是否是租户管理员
  bool isPtAdmin = 8; // 平台的管理员
  bool isPtOwner = 9; // 平台的租户管理员
  int64  appID = 10; // 访问的应用ID
  string account = 11 ;// 账号
  map<int64,ProjectAuth> projectAuth = 12; // 项目权限映射
  map<int64,int64> deptAuth = 13; // 部门权限映射（value是授权类型）
  map<string,int64> deptPathAuth = 14; // 部门路径权限映射（value是授权类型）
  string authType = 15; // 认证方式 user/open
  string accessKey = 16; // open token 的 accessKey
  int64 isFullAuth = 17; // 是否完全授权（1:是，2:否）
}
message UserRegisterReq{
  string regType =1; //注册方式:	phone手机号注册 email邮箱注册 wxopen 微信开放平台登录 wxin 微信内登录 wxminip 微信小程序 pwd 账号密码注册
  string account =2;    //手机号注册时填写手机号 账号密码注册时填写userName
  string code =3;    //验证码    微信注册填code
  string codeID =4;  //验证码编号 微信注册填state
  string password =5;//密码明文
  map<string,string> expand =7; //拓展, 微信登录方式 phoneCode:获取手机号code
  string deviceID =8;//设备ID 可选
  bool isWithLogin =9;//注册成功同时返回token,自动登录

  string nickName =10;//昵称,可选
  string tenantCode =11;//目标租户编码，显式透传，避免依赖上下文透传

}
message UserBindAccountReq{
  string type =1;//验证方式:phone手机号注册 wxOpen 微信开放平台登录 wxIn 微信内 wxMiniP 微信小程序
  string account = 2; //手机号,邮箱需要填写
  string code = 3;//验证码    微信登录填code
  string codeID = 4;//验证码编号 微信登录填state
}
message UserRoleGetListReq{
  int64 userID = 1;
}
message UserRoleGetListResp{
  int64 total = 1;
  repeated RoleInfo list = 2;//角色列表
}
message UserRoleBatchUpdateReq{
  int64 userID = 1;
  repeated int64 roleIDs = 2;//API列表数据
  repeated string roleCodes =3;//角色code
}
message UserDeptGetListReq{
  int64 userID = 1;
}
message UserDeptGetListResp{
  int64 total = 1;
  repeated DeptInfo list = 2;//部门列表
}
message UserDeptBatchSaveReq{
  int64 userID = 1;
  repeated int64 deptIDs = 2;//API列表数据
}
message IDList{
  repeated int64 ids=1; //ID集合
}
message UserMessageGetListReq{
  PageInfo page =1;          // 分页信息
  string group =2;           // 消息分组
  string notifyCode =3;      // 通知编码
  int64 isRead = 4;          // 是否已读（1:已读，2:未读）
  string str1        =5;     // 自定义参数1
  string str2        =6;     // 自定义参数2
  string str3        =7;     // 自定义参数3
  TimeRange createdTime = 8; // 创建时间范围
}
message UserMessageGetListResp{
  int64 total =1;            // 总条数
  repeated UserMessage list=2; // 用户消息列表
}
message UserMessageStatisticsResp{
  repeated UserMessageStatistics list =1; // 消息统计列表
}
message UserProfile{
  string code =1;    // 配置编码
  string params =2;  // 配置参数
}
message UserProfileGetListReq{
  repeated string codes =1; // 配置编码列表
}
message UserProfileGetListResp{
  repeated UserProfile profiles =1; // 用户配置列表
}
message UserPushClientReportReq{
  string pushClientId = 1; // uni-push 客户端 ID
  string platform = 2;     // android、ios、harmony、harmonyos 或 unbind
  string appId = 3;        // uni-app 应用 ID
  string appVersion = 4;   // App 版本号
}
//数据权限已迁移到 things/dmsvr，以下类型仅保留接口兼容
message DataProject {
  int64 projectID = 1;   //权限数据ID
  int64 authType = 2;    // 1:读权限 4:管理权限
  int64 targetID = 3;    //用户ID
  int64 updatedTime = 4; //更新时间
}
message DataArea {
  int64 areaID = 1;           //区域ID
  int64 authType = 2;         // 1:读权限 4:管理权限
  int64 isAuthChildren = 3;   //是否同时授权子节点（1:是，2:否）
  int64 areaIDPath = 4;
  int64 targetID = 5;         //用户ID或RoleID
  string targetType = 6;
  int64 updatedTime = 7;      //更新时间
}
message UserDataProjectGetListReq {
  PageInfo page = 1;  // 分页信息（不传默认2000条，相当于全部）
  int64 userID = 4;   // 用户ID
}
message UserDataProjectGetListResp {
  int64 total = 1;           // 总条数
  repeated DataProject list = 2; // 用户项目数据权限列表
}
message UserDataAreaGetListReq {
  PageInfo page = 1;   // 分页信息（不传默认2000条，相当于全部）
  int64 projectID = 3; // 项目ID（必选）
  int64 userID = 4;    // 用户ID
}
message UserDataAreaGetListResp {
  int64 total = 1;           // 总条数
  repeated DataArea list = 2; // 用户区域数据权限列表
}
message UserTenantGetListReq{
  PageInfo page =1;
  int64 status =21;                  // 用户状态（1:启用，2:禁用）
  int64 userID = 9; //如果不填,取 头里的,只有管理员 可以指定看别人的
  bool withRole = 22; //同时返回角色信息
}
message UserTenantGetListResp{
  int64 total = 1;
  repeated UserTenant list = 2;//用户列表
}


message UserThird {
  string appType = 1;     // 应用类型: wx:微信, wxMiniP:微信小程序, wxOpen:微信开放平台登录, ding:钉钉应用
  string thirdAppID = 2;  // 第三方应用ID
  int64 createdTime = 3;  // 创建时间（毫秒时间戳）
  string openID = 4;      // 第三方用户唯一ID（钉钉为 UserID）
  string unionID = 5;     // 第三方企业内唯一标识（钉钉 unionId）
}
message ProjectAuth {
  map<int64,int64> area=1; // 区域权限映射（key是区域ID, value是授权类型）
  map<string,int64> areaPath =3; // 区域路径权限映射（包含子节点的授权）
  int64  AuthType =2; // 项目的授权类型（1:管理权限, 2:读权限, 3:读写权限）
}
message JwtToken{
  string accessToken = 1;
  int64 accessExpire = 2;
  int64 refreshAfter = 3;
}

message UserMessage{
  int64 id =1;               // 消息ID
  int64 userID=2;            // 用户ID
  int64 isRead=3;            // 是否已读（1:已读，2:未读）
  MessageInfo message=4;     // 消息内容
}
message UserMessageStatistics{
  string group=1;          // 消息分组
  int64 count=2;           // 消息数量
}

// 用户ID包装类型
message UserWithID{
  int64 id = 1; // ID值
}

// 用户访问令牌 - 用于API认证（参考GitHub Personal Access Token）
message UserAccessTokenGetListReq {
  PageInfo page = 1;      // 分页信息
  int64 userID = 2;       // 用户ID（管理员可查看其他用户）
  string accessKey = 3;   // 按访问密钥标识过滤
}

message UserAccessTokenGetListResp {
  int64 total = 1;                      // 总条数
  repeated UserAccessToken list = 2;    // 访问令牌列表
}

message UserAccessToken {
  int64 id = 1;                              // 令牌ID
  int64 userID = 2;                          // 绑定的用户ID
  string accessKey = 3;                      // 访问密钥标识（唯一标识符，用于识别令牌）
  string accessSecret = 4;                   // 访问密钥（用于认证，仅创建时返回完整值）
  repeated string tenantCodes = 5;           // 可访问的租户列表（使用范围，空表示用户所有租户）
  string desc = 6;                           // 令牌描述/用途说明
  google.protobuf.Int64Value expTime = 10;   // 到期时间（毫秒时间戳），如果为0或null则不限制
  int64 createdTime = 11;                    // 创建时间（毫秒时间戳）
  bool isInternal = 12;                      // 是否内部令牌（系统生成，如 Skills Proxy）
}

// 内部令牌创建请求（系统调用，如 Skills Proxy）
message UserAccessTokenCreateInternalReq {
  int64 userID = 1;                          // 绑定的用户ID
  string tenantCode = 2;                     // 绑定的租户编码
  string purpose = 3;                        // 用途标识（如 skills-proxy）
  int64 expireAfterSeconds = 4;              // 过期时间（秒），0表示使用默认值（24小时）
}

// 内部令牌创建响应
message UserAccessTokenCreateInternalResp {
  int64 id = 1;                              // 令牌ID
  string accessKey = 2;                      // 访问密钥标识
  string accessSecret = 3;                   // 访问密钥（完整值，仅此一次返回）
  int64 expTime = 4;                         // 过期时间（毫秒时间戳）
}

// UserCreateTenantBinding 指定用户加入的企业及该企业的角色。
message UserCreateTenantBinding {
  string tenantCode = 1; // 企业编码
  repeated int64 roleIDs = 2; // 企业角色ID
}
// UserImportRow 是不含密码的导入行。
message UserImportRow {
  int64 row = 1; // 表格原始行号
  string userName = 2; // 登录名
  string nickName = 3; // 昵称
  string phone = 4; // 手机号
  string email = 5; // 邮箱
  int64 sex = 6; // 性别：0未知、1男、2女
}
// UserInfoBatchCreateReq 用统一密码和授权配置创建至多20个用户。
message UserInfoBatchCreateReq {
  repeated UserImportRow users = 1; // 导入行
  string password = 2; // 统一初始密码，沿用管理员创建的明文口径
  repeated int64 roleIDs = 3; // 平台角色ID
  repeated UserCreateTenantBinding tenantBindings = 4; // 企业及其角色
}
// UserImportResult 是单行创建结果，不回传密码或请求正文。
message UserImportResult {
  int64 row = 1; // 原始行号
  string status = 2; // success成功、skipped重复跳过、failed失败
  int64 userID = 3; // 成功创建的用户ID
  string message = 4; // 结果说明
}
// UserInfoBatchCreateResp 汇总当前批次的逐行结果。
message UserInfoBatchCreateResp {
  repeated UserImportResult list = 1; // 逐行结果
  int64 successCount = 2; // 成功数量
  int64 skipCount = 3; // 跳过数量
  int64 failCount = 4; // 失败数量
}
