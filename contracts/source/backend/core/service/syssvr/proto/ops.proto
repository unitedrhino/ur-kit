//--------------------运营管理服务--------------------
syntax = "proto3";
option go_package = "/sys";//必须为服务名
import "google/protobuf/wrappers.proto";
import "share.proto";
package sys;//必须为服务名

message OpsWithID{
  int64 id = 1; //ID值
}
message OpsEmpty{
}

service ops{
  //维护工单管理
  rpc opsWorkOrderCreate(OpsWorkOrder) returns(OpsWithID); //创建维护工单
  rpc opsWorkOrderUpdate(OpsWorkOrder) returns(OpsEmpty); //更新维护工单信息
  rpc opsWorkOrderGetList(OpsWorkOrderGetListReq) returns(OpsWorkOrderGetListResp); //获取维护工单列表（支持分页和过滤）
  rpc opsWorkOrderGetOne(OpsWithID) returns(OpsWorkOrder); //获取维护工单详情
  rpc opsWorkOrderDelete(OpsWithID) returns(OpsEmpty); //删除维护工单

  //用户反馈管理
  rpc opsFeedbackCreate(OpsFeedback)returns(OpsWithID); //创建用户反馈
  rpc opsFeedbackUpdate(OpsFeedback)returns(OpsEmpty); //更新用户反馈信息
  rpc opsFeedbackGetList(OpsFeedbackGetListReq)returns(OpsFeedbackGetListResp); //获取用户反馈列表（支持分页和过滤）
}

message OpsWorkOrder{
  int64 id = 1;
  string number =2;//编号
  int64 raiseUserID=3;//问题提出的用户
  int64 areaID = 4; //项目区域id
  string type =5;//工单类型: deviceMaintenance:设备维修工单 sceneAlarm:场景自动化报警
  map<string,string> params=6;//参数 json格式
  string issueDesc =8;//问题描述
  int64 status = 10;// 状态（1 待处理 2:处理中 3:已完成 4:已取消） (可修改)
  int64 createdTime = 11;//创建时间
  int64 handleTime =12;
  int64 finishedTime =13;
  int64 assignUserID = 14;//责任人用户ID（派单）
  int64 assignTime = 15;//派单时间
  int64 finishBy = 16;//完成人用户ID
  string annex = 17;//附件（oss 资源 id，逗号分隔）
  string remark = 18;//工单备注
  string cancelReason = 19;//取消原因
  string areaName = 20;//项目区域名称（只读，按 areaID 关联查询）
}
message OpsWorkOrderGetListReq{
  PageInfo page = 1;//分页信息 只获取一个则不填
  int64 status = 2;//状态（1 待处理 2:处理中 3:已完成）
  int64 areaID = 3;//区域ID过滤
  string type = 4;//工单类型
  string number = 5;//编号
  bool onlyMine = 6;//仅查看当前用户提交的工单
  int64 raiseUserID = 7;//按提单人过滤
}
message OpsWorkOrderGetListResp{
  repeated OpsWorkOrder list = 1;//设备信息
  int64  total = 2;//总数(只有分页的时候会返回)
}
message OpsFeedback{
  int64 id =1;
  string tenantCode =2;
  int64 raiseUserID =3;
  int64 projectID =4;
  string type =5;
  string contactInformation =6;
  string issueDesc =7;
  int64 createdTime = 8;
  int64 status = 9;//状态（1 待处理 2:处理中 3:已完成）
  int64 appID = 10;//所属应用ID
  int64 feedbackUserID = 11;//反馈用户ID
  string feedbackType = 12;//问题反馈类型: usageProblem/businessImpaired/businessUnavailable
  string detail = 13;//详细信息（页面URL + AI对话历史）
}
message OpsFeedbackGetListReq{
  PageInfo page = 1;//分页信息 只获取一个则不填
  int64 projectID=2;
  string type =3;
  bool isAllTenant =4;//default租户获取所有租户的信息
  string tenantCode =5; //过滤所属租户,isAllTenant为true有效
  int64 status = 6;//状态（1 待处理 2:处理中 3:已完成）
  int64 appID = 7;//按应用过滤
  string feedbackType = 8;//按问题反馈类型过滤
}
message OpsFeedbackGetListResp{
  repeated OpsFeedback list = 1;//设备信息
  int64  total = 2;//总数(只有分页的时候会返回)
}
