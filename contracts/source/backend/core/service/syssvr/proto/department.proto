//--------------------部门管理服务--------------------
syntax = "proto3";
option go_package = "/sys";//必须为服务名
import "google/protobuf/wrappers.proto";
import "share.proto";
import "role.proto";
package sys;//必须为服务名

message DeptWithID{
  int64 id = 1; //ID值
}

message DeptEmpty{
}

service DepartmentManage{
  rpc deptInfoGetOne(DeptInfoGetOneReq)returns(DeptInfo); //获取部门详情
  rpc deptInfoCreate(DeptInfo) returns(DeptWithID); //创建部门信息
  rpc deptInfoGetList(DeptInfoGetListReq) returns(DeptInfoGetListResp); //获取部门列表（支持分页和过滤）
  rpc deptInfoUpdate(DeptInfo) returns(DeptEmpty); //更新部门信息
  rpc deptInfoDelete(DeptWithID) returns(DeptEmpty); //删除部门

  rpc deptUserGetList(DeptUserGetListReq) returns (DeptUserGetListResp); //获取部门用户列表
  rpc deptUserBatchDelete(DeptUserBatchDeleteReq) returns(DeptEmpty); //批量删除部门用户关系
  rpc deptUserBatchCreate(DeptUserBatchCreateReq) returns(DeptEmpty); //批量创建部门用户关系

  rpc deptRoleGetList(DeptRoleGetListReq) returns (DeptRoleGetListResp); //获取部门角色列表
  rpc deptRoleBatchDelete(DeptRoleBatchSaveReq) returns(DeptEmpty); //批量删除部门角色关系
  rpc deptRoleBatchCreate(DeptRoleBatchSaveReq) returns(DeptEmpty); //批量创建部门角色关系

  rpc deptSyncJobExecute(DeptSyncJobExecuteReq)returns(DeptSyncJobExecuteResp); //执行部门同步任务
  rpc deptSyncJobGetOne(DeptSyncJobGetOneReq)returns(DeptSyncJob); //获取同步任务详情
  rpc deptSyncJobCreate(DeptSyncJob) returns(DeptWithID); //创建同步任务
  rpc deptSyncJobGetList(DeptSyncJobGetListReq) returns(DeptSyncJobGetListResp); //获取同步任务列表（支持分页和过滤）
  rpc deptSyncJobUpdate(DeptSyncJob) returns(DeptEmpty); //更新同步任务
  rpc deptSyncJobDelete(DeptWithID) returns(DeptEmpty); //删除同步任务
  rpc deptInfoGetLeaderChain(DeptInfoGetLeaderChainReq)returns(DeptInfoGetLeaderChainResp); //按 userID 取所属部门负责人链（主管审批，部门负责人语义）
}

message DeptInfo{
  int64 id = 1;
  string name= 2;         // 部门名称
  google.protobuf.StringValue desc = 3;        // 模块描述
  int64 status = 4; // 状态  1:启用,2:禁用
  int64 parentID =5;//父节点
  DeptInfo parent =6;
  repeated DeptInfo children =7;
  int64 sort = 8;          // 排序标记
  string idPath = 9;
  int64 userCount = 10;//只读,用户统计,包含下级部门的人数
  int64 dingTalkID = 11;// 钉钉的部门ID
  int64 adminUserID =12;//管理员账号
}
// 部门负责人链查询：按 userID 取所属部门（深度最浅为主归属部门）负责人链
message DeptInfoGetLeaderChainReq{
  int64 userID = 1;//用户ID（取所属部门负责人链）
  int64 deptID = 2;//可直接指定部门ID（优先于 userID）
}
message DeptInfoGetLeaderChainResp{
  repeated int64 leaderUserIDs = 1;//负责人 core 用户ID链（从所属部门向上，跳过发起人自己）
  repeated DeptInfo deptChain = 2;//对应的部门链（每级部门）
}
message DeptInfoGetOneReq{
  int64 id = 1;
  bool withFather = 2;//是否返回父级
  bool withChildren =3;//是否返回子级
  string tenantCode =10;//指定租户,只有超级管理员可以操作
}
message DeptInfoGetListReq{
  PageInfo page = 1;//分页信息
  int64 parentID =2;//父节点
  int64 status = 3; // 状态  1:启用,2:禁用
  string name = 4;  // 部门名称
  string tenantCode =10;//指定租户,只有超级管理员可以操作
  repeated int64 dingTalkIDs = 11;// 钉钉的部门ID
}
message DeptInfoGetListResp{
  repeated  DeptInfo list =1;
  int64 total = 2;
}
message DeptUserGetListReq{
  PageInfo page =1;
  int64 deptID = 2;
}
message DeptUserGetListResp{
  int64 total = 1;
  repeated DeptUser list = 2;//部门列表
}
message DeptUserBatchDeleteReq{
  int64 deptID = 1;
  repeated int64 ids = 2;//需要删除的id列表
}
message DeptUserBatchCreateReq{
  int64 deptID = 1;
  repeated int64 userIDs = 2;
  int64 authType =3;//授权类型
  int64 isAuthChildren =4;//是否同时授权子节点（1:是，2:否）
}
message DeptRoleGetListReq{
  int64 deptID = 1;
}
message DeptRoleGetListResp{
  int64 total = 1;
  repeated RoleInfo list = 2;//部门列表
}
message DeptSyncJobExecuteReq{
  int64 jobID =1;//同步任务的ID
}
message DeptSyncJobExecuteResp{
}
message DeptSyncJobGetOneReq{
  int64 id = 1;
}
message DeptSyncJob{
  int64 id = 1;
  int64 direction =2;// 同步的方向,1上游同步到联犀(默认),2联犀同步到下游
  string thirdType =3;//同步的类型
  ThirdAppConfig thirdConfig =4;//第三方配置
  map<string,string> fieldMap = 5;//用户字段映射,左边是联犀的字段,右边是第三方的,不填写就是全量映射
  repeated int64 syncDeptIDs=6;//同步的第三方部门id列表,不填为同步全部
  int64 isAddSync =7;//是否新增人员自动同步（1:是，2:否），默认为1
  int64 syncMode =8;//同步模式: 1:手动(默认) 2: 定时同步(半小时) 3: 实时同步
  int64 createdTime =9;//创建时间
}
message DeptSyncJobGetListReq{
  PageInfo page = 1;//分页信息
  int64 direction =2;// 同步的方向,1上游同步到联犀(默认),2联犀同步到下游
  string thirdType =3;//同步的类型
  int64 syncMode =8;//同步模式: 1:手动(默认) 2: 定时同步(半小时) 3: 实时同步
}
message DeptSyncJobGetListResp{
  repeated  DeptSyncJob list =1;
  int64 total = 2;
}


message DeptUser{
  int64 id =1;
  int64  userID = 2;
  int64 deptID =3;
  string deptIDPath=4;
  int64 authType =5;//授权类型
  int64 isAuthChildren =6;//是否同时授权子节点（1:是，2:否）
}
message DeptRoleBatchSaveReq{
  int64 deptID = 1;
  repeated int64 roleIDs = 2;//API列表数据
}
