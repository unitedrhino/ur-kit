//--------------------通用服务--------------------
syntax = "proto3";
option go_package = "/sys";//必须为服务名
import "google/protobuf/wrappers.proto";
import "share.proto";
import "tenant.proto";
import "department.proto";
package sys;//必须为服务名

message CommonEmpty{
}
message CommonWithCode{
  string code=1; //Code值
}

message CommonWithID{
  int64 id = 1; //ID值
}


service Common {
  rpc sysConfigInfoGetOne(CommonEmpty) returns(SysConfigInfo); //获取系统配置信息
  rpc sysConfigInfoUpdate(SysConfigInfo) returns(SysConfigInfo); //更新系统配置信息
  rpc systemInit(SystemInitReq) returns(CommonEmpty);//初始化系统
  rpc qrCodeGetOne(QRCodeGetOneReq)returns(QRCodeGetOneResp); //读取二维码信息
  rpc weatherGetOne(WeatherGetOneReq)returns(WeatherGetOneResp); //获取天气信息

  rpc serviceInfoGetOne(CommonWithCode)returns(ServiceInfo); //获取服务信息详情
  rpc serviceInfoUpdate(ServiceInfo) returns(CommonEmpty); //更新服务信息

  // rpc thirdDeptGetOne(ThirdDeptInfoGetOneReq)returns(DeptInfo);//获取第三方的部门信息详情，Children只能获取一层，需要递归获取
  // rpc thirdDeptGetList(ThirdDeptInfoGetListReq)returns(DeptInfoGetListResp);//获取第三方的部门信息列表，Children只能获取一层，需要递归获取
}

message SysConfigInfo {
  SysOemConfig oem = 1;              // OEM配置
  SysSmsConfig sms = 2;              // 短信配置，全租户共用
  SysEmailConfig email = 7;           // 邮件配置，全租户共用
  SysTenantConfig tenant = 3;        // 租户配置
  SysWeatherConfig weather = 4;      // 天气配置
  SysMapConfig map = 5;              // 地图配置
  SysLogConfig log = 6; //日志配置
  SysUserConfig user = 8;            // 用户配置
  SysLicenseConfig license = 9;      // license 配置（云边协同边缘节点，只读，禁止接口修改）
  SysOAuthConfig oauth = 10;         // OIDC/OAuth2 Provider 全局配置
  string defaultLanguage = 11;       // 平台默认语言；旧数据空值按中文处理
}

// SysLicenseConfig license 配置（云边协同边缘节点使用）
// 说明：
//   - 存 sys_config_info 数据库层， edge 定时恢复防篡改
//   - Enabled=true 表示该实例是 edge 部署，需校验 license
//   - Bundle 为 Ed25519 签名的 SignedBundle JSON
//   - 不含公钥（公钥编译进 edge 二进制，不可配置）
message SysLicenseConfig {
  bool enabled = 1;      // 是否启用 license 校验（edge=true）
  string bundle = 2;     // EntitlementBundle（SignedBundle JSON）

}

message SysEmailConfig {
  int64 isEnable = 7;        // 是否启用（1:启用，2:禁用）
  string from    =1;// 发件人  你自己要发邮件的邮箱
  string host    =2;// 服务器地址 例如 smtp.qq.com  请前往QQ或者你要发邮件的邮箱查看其smtp协议
  string secret  =3;// 密钥    用于登录的密钥 最好不要用邮箱密码 去邮箱smtp申请一个用于登录的密钥
  string nickname=4;// 昵称    发件人昵称 通常为自己的邮箱
  int64 port     =5;// 端口     请前往QQ或者你要发邮件的邮箱查看其smtp协议 大多为 465
  int64 isSsl    =6;        // 是否开启SSL（1:是，2:否）
}

message SysLogConfig {
  int64 operKeepDays = 1;  // 操作日志保留天数
  int64 loginKeepDays = 2; // 登录日志保留天数
}
message SysOemFooterConfig {
  string company_name = 1;     // 公司名称
  string company_site_link = 2; // 公司网站链接
  string date = 3;              // 年份或日期
  int64 is_enable = 4;          // 是否启用(1:启用，2:禁用)
  string icp = 5;               // ICP备案号
  string icp_link = 6;          // ICP备案的跳转链接
  string beian = 7;             // 公安备案号
  string beian_link = 8;        // 公安备案的跳转链接
}

message SysOemConfig {
  string avatar = 1;            // Logo图片地址
  string title = 2;             // 系统标题
  SysOemFooterConfig footer = 3; // 页脚信息
  string login_page_title = 4;       // 登录页左侧标题
  string login_page_description = 5; // 登录页左侧描述
  string login_form_title = 6;       // 登录表单标题
  string login_form_description = 7; // 登录表单描述
  string slogan_image_type = 8;      // Slogan图片类型: template/upload
  string slogan_image_template = 9;  // Slogan模板ID
  string slogan_image = 10;          // 上传的Slogan图片
}

message SysSmsConfig {
  int64 isEnable = 2;        // 是否启用（1:启用，2:禁用）
  string type = 1;            // 短信类型, ali: 阿里云 tencent: 腾讯
  string accessKeyID = 3;     // AccessKey ID
  string accessKeySecret = 4; // AccessKey Secret
  string appID = 5;           // 应用ID 短信SdkAppId在 [短信控制台] 添加应用后生成的实际SdkAppId，示例如1400006666,可前往 [短信控制台](https://console.cloud.tencent.com/smsv2/app-manage) 查看
  string signName = 6;          // 签名
}

// 分服务商凭据；查询时网关只返回密钥是否已配置。
message SysMapProviderConfig {
  string accessKey = 1;
  string accessSecret = 2;
  bool secretConfigured = 3;
  bool clearSecret = 4;
}

message SysMapConfig {
  int64 isEnable = 1;        // 是否启用（1:启用，2:禁用）
  string type = 2;         // 地图服务商模式 gaode: 高德 baidu: 百度 tianditu: 天地图 tencent: 腾讯
  string accessKey = 3;    // 访问密钥
  string accessSecret = 4; // 安全密钥/Secret，选填
  SysMapProviderConfig gaode = 5; // 高德独立配置
  SysMapProviderConfig tianditu = 6; // 天地图独立配置
  bool secretConfigured = 7; // 兼容字段：安全密钥是否已配置
  bool clearSecret = 8; // 明确清除当前服务商安全密钥

}

message SysWeatherConfig {
  int64 isEnable = 1;        // 是否启用（1:启用，2:禁用）
  string apiKey = 2;  // 天气API密钥
  string apiHost = 3; // 天气API主机地址
}

message SysUserConfig {
  int32 captchaLen = 1;              // 验证码长度
  int64 passLevel = 2;               // 用户密码强度级别
  int64 userOwnTenantLimit = 3;      // 用户可直接创建免费租户数量，0表示不可直接创建免费租户
  int64 ownerUserID = 4;             // 平台超级管理员ID
  int64 remindSetPassword = 5;       // 是否提醒未设置密码的用户设置密码(1:是，2:否)
  int64 forceSetPassword = 6;        // 是否强制未设置密码的用户登录后设置密码(1:是，2:否)
}

message SysOAuthConfig {
  string issuer = 1;       // issuer 标识，需与客户端访问地址完全一致
  string privateKey = 2;  // RS256 私钥（PEM 内容）
  int64 isEnable = 3;     // 是否启用（1:启用，2:禁用）
}

message SysTenantConfig {
  TenantLimit defaultLimit = 1;
}

message SystemInitReq{
  SysConfigInfo config = 1;
  UserCreate ownerUser = 2;
}
message QRCodeGetOneReq{
  string page =1; // 页面路径，例如 pages/index/index，根路径前不要填加 /，不能携带参数（参数请放在scene字段里），如果不填写这个字段，默认跳主页面。scancode_time为系统保留参数，不允许配置
  string scene=2; // 最大32个可见字符，只支持数字，大小写英文以及部分特殊字符：!#$&'()*+,/:;=?@-._~，其它字符请自行编码为合法字符（因不支持%，中文无法使用 urlencode 处理，请使用其他编码方式）
  string envVersion=3; // 要打开的小程序版本。正式版为 "release"，体验版为 "trial"，开发版为 "develop"。默认是正式版。
  string appID = 4; // 应用ID,第三方登录方式填写（钉钉、微信、oauth等）
}
message QRCodeGetOneResp{
  bytes buffer =1; // 二维码图片二进制数据
}
message WeatherGetOneReq  {
    Point position=1; // 地理位置坐标
    int64 ProjectID =2; // 项目ID
    string city =3; // 城市名称，如"昆明"
}
message WeatherGetOneResp  {
    string obsTime=1; // 观测时间
    string temp=2; // 温度（℃）
    string feelsLike=3; // 体感温度（℃）
    string icon=4; // 天气图标代码
    string text=5; // 天气文字描述
    string wind360=6; // 风向360角度
    string windDir=7; // 风向
    string windScale=8; // 风力等级
    string windSpeed=9; // 风速（km/h）
    string humidity=10; // 相对湿度（%）
    string precip=11; // 降水量（mm）
    string pressure=12; // 大气压强（hPa）
    string vis=13; // 能见度（km）
    string cloud=14; // 云量
    string dew=15; // 露点温度
    WeatherAir air=17; // 空气质量信息
}
message ServiceInfo{
  string code =1;//服务编码
  string name =2;//服务名称
  string version =3;//服务版本
  string desc =4; //服务描述
  int64 createdTime =5;//创建时间（毫秒时间戳）
  int64 updatedTime = 6;//更新时间（毫秒时间戳）
}
message ThirdDeptInfoGetOneReq{
  int64 id = 1;//需要获取的第三方部门ID,顶级为1
  bool withFather = 2;//是否返回父级
  bool withChildren =3;//是否返回子级
  string thirdType =4;//第三方的类型 ding:钉钉  wxE:企业微信
  ThirdAppConfig thirdConfig =5;//第三方配置
}

message ThirdDeptInfoGetListReq{
  PageInfo page = 1;//分页信息
  int64 parentID =2;//父节点
  string thirdType =3;//第三方的类型 ding:钉钉  wxE:企业微信
  ThirdAppConfig thirdConfig =4;//第三方配置
}
message UserCreate{
  string userName =2;//用户账号
  string password =3;//密码原文
  google.protobuf.StringValue email = 4;//可选
  google.protobuf.StringValue phone =5;//可选
  string nickName =9;//可选
  string avatar =19;//可选,创建的时候传filePath
}

// WeatherAir 空气质量信息
// 定义空气质量的详细参数
message WeatherAir  {
    string aqi =1; //空气质量指数
    string level =2; //污染级别
    string category =3; //空气质量类别
    string primary =4; //主要污染物
    string pm10 =5; //PM10浓度
    string pm2p5 =6; //PM2.5浓度
    string no2 =7; //二氧化氮浓度
    string so2 =8; //二氧化硫浓度
    string co =9;
    string o3 =10;
}
