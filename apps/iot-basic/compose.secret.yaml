# 本文件为启动注册挂载 Docker Secret；与 compose.yaml 一起使用，令牌不进入构建参数。
services:
  iot-basic:
    environment:
      PLATFORM_BOOTSTRAP_TOKEN: ""
      PLATFORM_BOOTSTRAP_TOKEN_FILE: /run/secrets/platform-bootstrap-token
    secrets:
      - platform-bootstrap-token
secrets:
  platform-bootstrap-token:
    file: ${PLATFORM_BOOTSTRAP_TOKEN_SOURCE:?请配置仓库外的令牌文件}
