# 本文件用占位环境变量在本机启动公开 IoT 基础应用示例。
services:
  iot-basic:
    build:
      context: ../..
      dockerfile: apps/iot-basic/Dockerfile
      args:
        VITE_GLOB_APPID: ${APP_ID:-600}
    image: ur-kit-iot-basic:${IMAGE_VERSION:-local}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      PLATFORM_URL: ${PLATFORM_URL:?请配置平台 HTTP(S) 根地址}
      APP_ID: ${APP_ID:-600}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      APP_AUTO_REGISTER: ${APP_AUTO_REGISTER:-true}
      PLATFORM_BOOTSTRAP_TOKEN: ${PLATFORM_BOOTSTRAP_TOKEN:-}
    restart: unless-stopped
